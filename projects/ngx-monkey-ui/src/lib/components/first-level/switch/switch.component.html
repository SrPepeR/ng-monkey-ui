<label
  [for]="inputId"
  class="switch-label"
  [class]="classList"
  [class.dark-theme]="isDarkMode$ | async"
  >{{ offLabel }}</label
>

<div class="switch-container">
  <label class="switch" [class]="classList" [class.dark-theme]="isDarkMode$ | async">
    <input #switch type="checkbox" [id]="inputId" [name]="inputId" (change)="onSwitched()" />
    <span class="slider" [class.dark-theme]="isDarkMode$ | async"></span>
  </label>
</div>
