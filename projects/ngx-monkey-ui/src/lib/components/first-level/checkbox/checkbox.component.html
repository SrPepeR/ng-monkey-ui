<label
  class="container"
  [for]="inputId"
  [class]="classList"
  [class.dark-theme]="isDarkMode$ | async"
>
  <input
    #checkbox
    type="checkbox"
    [name]="inputId"
    [id]="inputId"
    [class]="classList"
    [class.dark-theme]="isDarkMode$ | async"
    (change)="onChanged()"
  />

  <span class="checkmark" [class]="classList" [class.dark-theme]="isDarkMode$ | async"></span>

  <span class="label" [class]="classList" [class.dark-theme]="isDarkMode$ | async">{{
    label
  }}</span>
</label>
